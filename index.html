<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ultimate Wave Tracker</title>
<style>
:root{--bg:#222;--panel:#383838;--row:#2e2e2e;--text:#e8e8e8;--mut:#8a8a8a;--ok:#2c9f3a;--focus:#6ab0ff;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.3 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#bar{display:contents}
header{position:sticky;top:0;z-index:20;background:var(--bg);display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;padding:14px 24px}
select,button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
#cat{margin:0;font-size:22px;font-weight:700}
nav button{background:none;border:0;color:var(--mut);font-weight:600;padding:6px 10px;cursor:pointer}
nav button:hover,nav button[aria-pressed=true]{color:var(--text)}
#subs:empty{display:none}
#subs{display:flex;flex-wrap:wrap;gap:6px;padding:20px 24px 10px}
#subs button{background:var(--panel);border:0;border-radius:4px;padding:6px 14px;cursor:pointer;color:var(--mut)}
#subs button[aria-selected=true]{background:#e8e8e8;color:#222;font-weight:600}
#grid{margin:0 24px;padding:8px 0 40px}
.tiers{display:flex;flex-wrap:wrap;justify-content:center;align-items:flex-start;gap:48px 44px}
.divider{display:flex;align-items:center;gap:16px;margin:44px 0 30px;color:var(--mut);font-size:18px;font-weight:600}
.divider.first{margin-top:12px}
.divider::before,.divider::after{content:"";flex:1;height:2px;background:#555}
.tier{background:var(--panel);flex:0 0 360px;max-width:100%}
.tier h2{margin:0;padding:10px 12px;text-align:center;font-size:26px;color:#fff;text-shadow:0 1px 2px #0006}
body.fx .tier h2{position:relative;z-index:1;transition:box-shadow .5s}
body.fx .tier.g1 h2{box-shadow:0 0 12px 1px color-mix(in srgb,var(--tc) 45%,transparent)}
body.fx .tier.g2 h2{box-shadow:0 0 16px 3px color-mix(in srgb,var(--tc) 58%,transparent)}
body.fx .tier.pulse h2{animation:fxpulse 1.2s ease-out}
@keyframes fxpulse{20%{box-shadow:0 0 30px 8px var(--tc)}}
@media (prefers-reduced-motion:reduce){body.fx .tier.pulse h2{animation:none}}
body.cond .tier .list{max-height:350px;overflow-y:auto;scrollbar-width:thin;scrollbar-color:#666 transparent;overscroll-behavior:contain}
.tier h2 small{display:block;font-size:14px;font-weight:600;opacity:.9}
.lv{display:flex;align-items:center;gap:6px;padding:0 0 0 8px;background:var(--row);margin-bottom:3px;min-height:32px}
